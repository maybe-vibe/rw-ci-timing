name: Update CI timing data

on:
  schedule:
    # 08:23 UTC+8: after the overnight lull, before the 09:00 UTC+8 merges start.
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Append new commits to commits.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 fetch_data.py
      - name: Commit commits.jsonl if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commits.jsonl
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Append new main commits"
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
